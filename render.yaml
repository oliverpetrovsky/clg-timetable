services:
  - type: web
    name: college-timetable
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set this in Render Dashboard from your MongoDB Atlas cluster URI
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAIN
        value: "*" # Set to your college domain (e.g. yourcollege.edu) to restrict signups
      - key: NEXT_PUBLIC_APP_NAME
        value: College Timetable Tracker
